# Disposable PostgreSQL for the auth integration suites.
#
#   docker compose up -d test-db
#
# The org-mode suite wipes and recreates the public schema on every run, so
# no volumes are attached — state is intentionally ephemeral.
services:
  test-db:
    image: postgres:16-alpine
    container_name: generic-auth-test-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: auth_test
    ports:
      - "127.0.0.1:5544:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d auth_test"]
      interval: 2s
      timeout: 3s
      retries: 15
